name: "[python] Release wheels"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: make wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 1

  publish-release:
    runs-on: ubuntu-latest
    needs: release-wheel
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist

      - name: Normalize release version
        id: normalize
        run: |
          version="${{ inputs.version }}"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Rename wheel to stable filename
        run: mv dist/*.whl dist/uploader-latest-py3-none-any.whl

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.normalize.outputs.release_tag }}
          name: Release ${{ steps.normalize.outputs.release_tag }}
          generate_release_notes: true
          files: dist/uploader-latest-py3-none-any.whl
