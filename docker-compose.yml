services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    ports:
      - "5001:5000"
    working_dir: ${PWD}
    volumes:
      - ${PWD}/outputs:${PWD}/outputs
      - ${PWD}/mlartifacts:${PWD}/mlartifacts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p outputs mlartifacts
        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:///outputs/mlflow.db \
          --artifacts-destination ./mlartifacts

  prefect:
    image: prefecthq/prefect:3-latest
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://127.0.0.1:4200/api
    entrypoint: ["prefect"]
    command: ["server", "start", "--host", "0.0.0.0"]
