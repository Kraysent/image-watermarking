max_epochs: 200
lr: 0.001
seed: 0
device: mps
max_steps: null
checkpoint_dir: outputs/checkpoints
checkpoint_every: 10
trace_sample_pct: 2
early_stop:
  patience: 20
  min_delta_pct: 0.1
  min_epoch: 1000
loss:
  w_msg: 2.0
  w_img: 1.0
  message_loss_type: mse
  image_loss_type: mse
attacks:
  - type: jpeg
    probability: 0.4
    args:
      quality: [70, 95]
  - type: crop
    probability: 0.2
    args:
      scale: [0.85, 0.98]
  - type: rotate
    probability: 0.01
    args: {}
  - type: blur
    probability: 0.05
    args:
      radius: [0.3, 1.0]
  - type: resize
    probability: 0.05
    args:
      scale: [0.75, 0.95]
  - type: brightness
    probability: 0.05
    args:
      factor: [0.8, 1.2]
  - type: hflip
    probability: 0.01
    args: {}
